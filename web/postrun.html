<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimRelay 34 Post-Run</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%232563eb%22/%3E%3Cpath d=%22M9 2 5 9h3l-1 5 4-7H8z%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
<style>
  html, body { overflow: auto; height: auto; }
  .pr { max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px; }
  .pr-hdr { position: sticky; top: 0; z-index: 10; }
  .intro { color: var(--text-2); font-size: 13.5px; max-width: 900px; margin: 4px 0 18px; line-height: 1.55; }
  h1 { font-size: 22px; margin: 6px 0 2px; letter-spacing: -.3px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .tile { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow); }
  .tile .l { font-size: 11.5px; color: var(--muted); font-weight: 500; }
  .tile .v { font: 600 24px var(--sans); letter-spacing: -.4px; margin-top: 2px; }
  .tile .s { font-size: 11.5px; color: var(--text-2); margin-top: 2px; }
  .sec { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 18px; overflow: hidden; }
  .sec-h { display: flex; align-items: baseline; gap: 10px; padding: 14px 18px 4px; flex-wrap: wrap; }
  .sec-h .n { font: 600 11px var(--mono); color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 999px; }
  .sec-h h2 { font-size: 16px; margin: 0; }
  .sec-h .tag2 { font-size: 11px; color: var(--muted); }
  .sec-h .dl { margin-left: auto; display: flex; gap: 6px; }
  .sec-h .dl a { font-size: 11.5px; color: var(--text-2); text-decoration: none; border: 1px solid var(--line-2); border-radius: 6px; padding: 3px 8px; }
  .sec-h .dl a:hover { border-color: var(--accent); color: var(--accent); }
  .sec .why { padding: 0 18px 8px; color: var(--text-2); font-size: 12.5px; max-width: 1000px; }
  .sec img { display: block; width: 100%; height: auto; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #fcfcfb; }
  .finding { margin: 12px 18px; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--panel-2); border-radius: 6px; font-size: 12.5px; line-height: 1.5; }
  details { margin: 0 18px 14px; }
  summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--text-2); padding: 4px 0; }
  .tbl { border-collapse: collapse; font: 11.5px var(--mono); margin-top: 6px; }
  .tbl th, .tbl td { border-bottom: 1px solid var(--line); padding: 4px 10px; text-align: right; }
  .tbl th { font: 600 11px var(--sans); color: var(--muted); }
  .tbl th:first-child, .tbl td:first-child { text-align: left; }
  .wait { padding: 40px; text-align: center; color: var(--muted); }
  .files { display: flex; flex-wrap: wrap; gap: 8px; margin: -8px 0 20px; }
  .files a { font-size: 12px; text-decoration: none; color: var(--text-2); border: 1px solid var(--line-2); background: #fff; border-radius: 7px; padding: 5px 10px; }
  .files a:hover { border-color: var(--accent); color: var(--accent); }
  @media (max-width: 700px) { .pr { padding: 14px 16px 40px; } .sec-h .dl { margin-left: 0; } }
</style>
</head>
<body>
<header id="hdr" class="pr-hdr">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 16 16"><path d="M9 2 5 9h3l-1 5 4-7H8z" fill="#fff"/></svg></div>
    <div><div class="b1">SimRelay 34</div><div class="b2">IEEE 34-Bus Protection Test Bench</div></div>
  </div>
  <div style="flex:1"></div>
  <a class="btn" href="index.html" style="text-decoration:none">Real-Time View</a>
</header>
<main class="pr" id="pr">
  <div class="wait">Loading post-run results</div>
</main>
<script type="module" src="js/postrun.js"></script>
</body>
</html>
